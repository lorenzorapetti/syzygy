[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Lorenzo Rapetti <lorenzo.rapetti.94@gmail.com>"]

[workspace.dependencies]
syzygy-store = { path = "crates/syzygy-store" }
syzygy-tidal = { path = "crates/syzygy-tidal" }

aes-gcm = "0.11"
base64 = "0.23"
dirs = "7"
flexi_logger = "0.31"
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "lazy", "advanced"] }
keyring = "4"
log = "0.4"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = "1"
zeroize = "1"
