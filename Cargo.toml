[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Lorenzo Rapetti <lorenzo.rapetti.94@gmail.com>"]

[workspace.dependencies]
syzygy-audio = { path = "crates/syzygy-audio" }
syzygy-catalog = { path = "crates/syzygy-catalog" }
syzygy-mpris = { path = "crates/syzygy-mpris" }
syzygy-report = { path = "crates/syzygy-report" }
syzygy-store = { path = "crates/syzygy-store" }
syzygy-tidal = { path = "crates/syzygy-tidal" }

aes-gcm = "0.11"
alsa = "0.12"
arc-swap = "1"
base64 = "0.23"
crossbeam-channel = "0.5"
dirs = "7"
flexi_logger = "0.31"
futures = "0.3"
gstreamer = "0.25"
gstreamer-app = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Wayland only: iced's defaults without "x11".
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "linux-theme-detection",
    "wayland",
    "tokio",
    "image",
    "svg",
    "lazy",
    "advanced",
    "qr_code",
] }
iced_aw = { version = "0.14.1", default-features = false, features = ["context_menu"] }
keyring = "4"
libc = "0.2"
log = "0.4"
mpris-server = "0.10"
open = "5"
rand = "0.10"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# Dependencies are built optimized even in dev builds. Unoptimized, iced's
# text stack takes ~230 ms to shape a line that needs a fallback font (CJK
# titles, say), so scrolling a track list stalls each time such a row is
# built. syzygy's own crates stay unoptimized, so rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 3
