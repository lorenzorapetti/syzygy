  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- The line the three bodies share -->
  <line x1="96" y1="416" x2="416" y2="96" stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <circle cx="176" cy="336" r="84" fill="url(#sun)"/>
  <circle cx="314" cy="198" r="48" fill="url(#planet)"/>
  <circle cx="390" cy="122" r="24" fill="#e2e8f0"/>
